{% extends 'base.html' %}
{% block titulo %}Buscar · Grupo SABA{% endblock %}
{% block conteudo %}<h1>Buscar cadastros</h1><form method="get" action="{{ url_for('busca') }}">
<label>Nome, documento, telefone, categoria ou ID<input name="termo" value="{{ termo }}"></label>
<label>Grupo<select name="grupo"><option value="">Ambos</option>{% for g in categorias %}<option {% if g==grupo %}selected{% endif %}>{{ g }}</option>{% endfor %}</select></label><button>Buscar</button></form>
<p>{{ pessoas|length }} resultado(s)</p>{% include 'tabela.html' %}{% endblock %}
