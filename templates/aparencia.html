{% extends 'base.html' %}{% block content %}<section class="page"><h1>Textos e banner</h1><p>As alterações aparecem no site após salvar. Use imagens hospedadas em endereços HTTPS e autorizadas para divulgação.</p><form method="post">{% for chave,rotulo in campos.items() %}<label>{{ rotulo }}{% if chave=='banner_imagem' %}<input type="url" name="{{ chave }}" value="{{ dados.get(chave,'') }}" maxlength="1200">{% else %}<textarea name="{{ chave }}" maxlength="1200">{{ dados.get(chave,'') }}</textarea>{% endif %}</label>{% endfor %}<button class="button">Salvar textos e banner</button></form></section>{% endblock %}
