{% extends 'base.html' %}{% block content %}<section class="page narrow"><h1>Construir uma parceria</h1><p>Informe apenas o necessário para que a equipe possa entrar em contato. O cadastro não garante atendimento imediato.</p><form method="post"><label>Categoria<select name="tipo_pessoa"><option value="fisica">Pessoa física</option><option value="juridica">Pessoa jurídica</option></select></label><label>Nome<input name="nome" value="{{ dados.get('nome', '') }}" maxlength="500" required></label><label>E-mail<input name="email" value="{{ dados.get('email', '') }}" maxlength="500" required></label><label>Telefone<input name="telefone" value="{{ dados.get('telefone', '') }}" maxlength="500" required></label><label>Tipo de apoio oferecido<input name="tipo_apoio" value="{{ dados.get('tipo_apoio', '') }}" maxlength="500" required></label><label class="check"><input type="checkbox" name="consentimento" required> Autorizo o uso dos dados para avaliação e contato.</label><button class="button">Enviar cadastro</button></form></section>{% endblock %}
