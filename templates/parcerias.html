{% extends 'base.html' %}{% block content %}<section class="page narrow"><h1>Construir uma parceria</h1><p>Informe apenas o necessário para que a equipe possa entrar em contato. Você pode colaborar com recursos, materiais ou serviços.</p><form method="post"><label>Categoria<select name="tipo_pessoa"><option value="fisica">Pessoa física</option><option value="juridica" {% if dados.get('tipo_pessoa') == 'juridica' %}selected{% endif %}>Pessoa jurídica</option></select></label><label>Nome<input name="nome" value="{{ dados.get('nome', '') }}" maxlength="500" required></label><label>E-mail<input name="email" type="email" autocomplete="email" value="{{ dados.get('email', '') }}" maxlength="500" required></label><label>Telefone<input name="telefone" type="tel" autocomplete="tel" value="{{ dados.get('telefone', '') }}" maxlength="500" required></label><label>Tipo de apoio oferecido<input name="tipo_apoio" value="{{ dados.get('tipo_apoio', '') }}" maxlength="500" required></label><label class="check"><input type="checkbox" name="consentimento" required> Autorizo o uso dos dados para avaliação e contato.</label><button class="button">Enviar cadastro</button></form><p>Leia como cuidamos das informações no <a href="/privacidade">aviso de privacidade</a>.</p></section>{% endblock %}
