{% extends 'base.html' %}{% block content %}<section class="page narrow"><h1>{{ 'Editar' if identificador else 'Cadastrar' }} conteúdo</h1><a href="{{ url_for('central',colecao=colecao) }}">Voltar à consulta</a><form method="post">{% for chave,rotulo in campos %}<label>{{ rotulo }}{% if chave=='projeto_id' %}<select name="{{ chave }}"><option value="">Acervo geral</option>{% for p in projetos %}<option value="{{ p.id }}" {% if dados.get(chave)|string==p.id|string %}selected{% endif %}>{{ p.titulo }}</option>{% endfor %}</select>{% elif chave in ['objetivo','resumo'] %}<textarea name="{{ chave }}" maxlength="1200" required>{{ dados.get(chave,'') or '' }}</textarea>{% else %}<input name="{{ chave }}" value="{{ dados.get(chave,'') or '' }}" maxlength="1200" type="{{ 'url' if chave in ['url','fonte','imagem'] else 'date' if chave=='data' else 'text' }}" {% if chave in ['titulo','url','fonte','data'] %}required{% endif %}>{% endif %}</label>{% endfor %}<button class="button">Salvar conteúdo</button></form></section>{% endblock %}
