<div class="gallery">{% for foto in fotos %}<figure><a href="{{ foto.url }}" target="_blank" rel="noopener noreferrer"><img src="{{ foto.url }}" alt="{{ foto.titulo }}" loading="lazy" width="640" height="420"></a><figcaption>{{ foto.titulo }}<br><a href="{{ foto.fonte }}" target="_blank" rel="noopener noreferrer">Fonte institucional ↗</a></figcaption></figure>{% else %}<p>Os registros desta ação serão publicados pela equipe.</p>{% endfor %}</div>
